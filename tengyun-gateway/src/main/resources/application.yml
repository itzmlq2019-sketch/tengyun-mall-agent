server:
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      routes:
        - id: user-route
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: order-route
          uri: lb://order-service
          predicates:
            - Path=/order/**
        - id: product-route
          uri: lb://product-service
          predicates:
            - Path=/product/**
        - id: cart-route
          uri: lb://cart-service
          predicates:
            - Path=/cart/**
        - id: agent-route
          uri: lb://agent-service
          predicates:
            - Path=/agent/**

security:
  jwt:
    secret: ${JWT_SECRET:TengYunMallSecretKeyMustBeAtLeast256BitsLong==}
